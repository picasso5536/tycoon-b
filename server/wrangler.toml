name = "tycoon-b-api"
main = "src/index.js"
compatibility_date = "2026-08-01"

# 방 하나가 Durable Object 하나. 와일드카드 구독이라는 개념 자체가 없다.
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# D1 — 계정 / 랭킹 / 명부
# database_id 는 `wrangler d1 create tycoon-b` 후 출력된 값으로 채운다.
[[d1_databases]]
binding = "DB"
database_name = "tycoon-b"
database_id = "REPLACE_WITH_YOUR_D1_ID"

[observability]
enabled = true
